name: planner_remote_mcp
description: >-
  Planner MCP server (remote). Same tool surface as the local `planner` MCP but
  proxies to a planner_server over HTTPS instead of opening planner.db directly.
version: 1.0.0
publish_to: none
repository: https://github.com/jhsware/dart_dev_mcp

environment:
  sdk: ^3.9.3
resolution: workspace

dependencies:
  mcp_dart: ^1.2.2
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
